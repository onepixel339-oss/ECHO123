# ECHO — CI (Phase 1, A1).
#
# Every gate that exists locally runs on every push and PR:
#   quality  — lint (strict lib/echo rules), tsc --noEmit (noImplicitAny),
#              domain tests (bun), secret scan (+ its self-test) and the
#              version-consistency check
#   build    — the production build must succeed
#   e2e      — the Playwright suite (32 tests, 7 flow files incl. the
#              1.3.0 scope gates) against the standalone production server;
#              providers are mocked at the network layer, so CI never calls
#              a live provider
#
# Stage 3 addition — syncdb: the X-1..X-11 / T-2 / T-3 / T-4 / T-5 database
# suites run against a real postgres:19 service container (the local
# embedded-postgres harness boots its own cluster; the CI container provides
# the same migration-role semantics — X-11 environment parity).
#
# The cost-table drift check runs in the quality job since Stage 2.
# Deliberately NOT in CI: the perf baseline (machine-class numbers — a
# dedicated A3 Lighthouse pass owns performance) and any live-provider
# smoke test (they need explicit authorization).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (strict lib/echo rules + repo-wide eslint)
        run: bun run lint

      - name: Type-check (tsc --noEmit, noImplicitAny)
        run: bun run typecheck

      - name: Domain tests
        run: bun run test

      - name: Secret scan (with self-test)
        run: |
          bun run secret-scan:self-test
          bun run secret-scan

      - name: Version consistency (package.json = Settings = CHANGELOG)
        run: bun run version-check

      - name: Cost-table drift check
        run: bun run cost-table:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build the standalone production server
        run: bun run build:standalone

      - name: Six-flow e2e suite (mocked providers, no live calls)
        run: bun run test:e2e

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  syncdb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Database suites (X / T-2 / T-3 / T-4 / T-5) on embedded PostgreSQL
        run: bun run test:syncdb
